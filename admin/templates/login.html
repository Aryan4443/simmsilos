<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>SimmSilos Admin — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;width:360px;display:flex;flex-direction:column;gap:20px}
    .logo{text-align:center;font-size:26px;font-weight:700;color:#58a6ff}
    .subtitle{text-align:center;font-size:13px;color:#8b949e;margin-top:-12px}
    label{font-size:12px;color:#8b949e;margin-bottom:4px;display:block}
    input{width:100%;padding:10px 12px;background:#0d1117;color:#e2e8f0;border:1px solid #30363d;border-radius:6px;font-size:14px;outline:none}
    input:focus{border-color:#58a6ff}
    button{width:100%;padding:11px;background:#238636;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
    button:hover{opacity:0.9}
    .error{color:#f85149;font-size:13px;text-align:center;background:#2a1f1f;padding:10px;border-radius:6px;border:1px solid #6e1f1f}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SimmSilos</div>
    <div class="subtitle">Admin Panel</div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for msg in messages %}<div class="error">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <div style="margin-bottom:16px">
        <label>Username</label>
        <input name="username" type="text" placeholder="Admin username" autofocus required/>
      </div>
      <div style="margin-bottom:20px">
        <label>Password</label>
        <input name="password" type="password" placeholder="Password" required/>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
