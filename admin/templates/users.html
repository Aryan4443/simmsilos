{% extends "base.html" %}
{% block content %}
<h1>Users</h1>

<div class="card">
  <h2>Register New User</h2>
  <form method="POST" action="/users/register">
    <div class="form-row">
      <input name="username" placeholder="Username" required/>
      <input name="password" type="password" placeholder="Password" required/>
      <select name="role">
        <option value="developer">Developer</option>
        <option value="viewer">Viewer</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit" class="btn btn-primary">Register</button>
    </div>
  </form>
</div>

<div class="card">
  <h2>All Users</h2>
  <div class="form-row" style="margin-bottom:16px">
    <input id="search" placeholder="Search username..." oninput="filter()" style="max-width:260px"/>
    <select id="roleFilter" onchange="filter()">
      <option value="">All roles</option>
      <option value="admin">Admin</option>
      <option value="developer">Developer</option>
      <option value="viewer">Viewer</option>
    </select>
  </div>
  <table id="userTable">
    <thead><tr><th>Username</th><th>Role</th><th>Branch</th><th>Actions</th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.username }}</td>
        <td><span class="badge badge-{{ user.role }}">{{ user.role }}</span></td>
        <td>{{ branches.get(user.username, '—') }}</td>
        <td style="display:flex;gap:8px;align-items:center">
          <form method="POST" action="/users/{{ user.username }}/role" style="display:flex;gap:6px">
            <select name="role" style="padding:5px 8px;font-size:12px">
              <option {% if user.role == 'developer' %}selected{% endif %} value="developer">developer</option>
              <option {% if user.role == 'viewer' %}selected{% endif %} value="viewer">viewer</option>
              <option {% if user.role == 'admin' %}selected{% endif %} value="admin">admin</option>
            </select>
            <button class="btn btn-secondary" style="padding:5px 10px;font-size:12px">Update</button>
          </form>
          <form method="POST" action="/users/{{ user.username }}/delete" onsubmit="return confirm('Delete {{ user.username }}?')">
            <button class="btn btn-danger" style="padding:5px 10px;font-size:12px">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  function filter() {
    const q = document.getElementById("search").value.toLowerCase();
    const role = document.getElementById("roleFilter").value.toLowerCase();
    document.querySelectorAll("#userTable tbody tr").forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = (text.includes(q) && text.includes(role)) ? "" : "none";
    });
  }
</script>
{% endblock %}
