ServerName simmsilos-gateway
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

ProxyRequests Off
ProxyPreserveHost On

<VirtualHost *:80>

    # ── gateway health ────────────────────────────────────
    <Location /gateway/health>
        SetHandler none
        Header always set Content-Type "application/json"
        Redirect 200 /gateway/health
    </Location>

    # ── user side (your FastAPI) ──────────────────────────
    # per-branch <Location> blocks are managed by port_registry.py
    Include conf/branches.conf

    # ── admin side (partner's Flask service) ─────────────
    <Location /admin/>
        ProxyPass        http://simmsilos-admin:5000/
        ProxyPassReverse http://simmsilos-admin:5000/
        RequestHeader set X-Gateway "apache"
    </Location>

    # ── partner's silo VSC service ────────────────────────
    <Location /vsc/>
        ProxyPass        http://simmsilos-vsc:5000/
        ProxyPassReverse http://simmsilos-vsc:5000/
        RequestHeader set X-Gateway "apache"
    </Location>

</VirtualHost>
