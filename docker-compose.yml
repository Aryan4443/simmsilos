services:
  postgres:
    image: postgres:16
    container_name: simmsilos-postgres
    networks: [simmsilos-net]
    environment:
      POSTGRES_DB: simmsilos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: simmsilos-redis
    networks: [simmsilos-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  auth:
    build: .
    container_name: simmsilos-feature-x
    networks: [simmsilos-net]
    ports:
      - "3000:3000"
    environment:
      BRANCH: feature-x
      JWT_SECRET: ${JWT_SECRET:-change-me-local-jwt-secret}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-local-service-token}
      DB_HOST: postgres
      DB_NAME: simmsilos
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      SILO_SERVICE_URL: ${SILO_SERVICE_URL:-http://simmsilos-vsc:5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    image: python:3.11-slim
    container_name: simmsilos-admin
    networks: [simmsilos-net]
    ports:
      - "8000:8000"
    volumes:
      - ./admin:/app
    working_dir: /app
    command: sh -c "pip install flask requests -q && python app.py"
    environment:
      API_URL: http://simmsilos-feature-x:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-local-service-token}
      ADMIN_SECRET: ${ADMIN_SECRET:-admin-dev-secret}
    depends_on:
      - auth

  mock-silo:
    image: python:3.11-slim
    container_name: simmsilos-vsc
    networks: [simmsilos-net]
    volumes:
      - ./mock_silo.py:/app/mock_silo.py
    working_dir: /app
    command: sh -c "pip install flask -q && python mock_silo.py"

  prometheus:
    image: prom/prometheus:latest
    container_name: simmsilos-prometheus
    networks: [simmsilos-net]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: simmsilos-grafana
    networks: [simmsilos-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-data:/var/lib/grafana

  apache:
    image: httpd:alpine
    container_name: simmsilos-gateway
    networks: [simmsilos-net]
    ports:
      - "80:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/branches.conf:/usr/local/apache2/conf/branches.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  simmsilos-net:
    external: true

volumes:
  pgdata:
  grafana-data:
