services:
  postgres:
    image: postgres:16
    container_name: simmsilos-postgres
    networks: [simmsilos-net]
    environment:
      POSTGRES_DB: simmsilos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: simmsilos-redis
    networks: [simmsilos-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  auth:
    build: .
    container_name: simmsilos-feature-x
    networks: [simmsilos-net]
    ports:
      - "3000:3000"
    environment:
      BRANCH: feature-x
      JWT_SECRET: dev-secret
      SERVICE_TOKEN: NKN8pN4iVtWAKAyJqwHb5Xp4n397MFiCghUZEWDW9bw
      DB_HOST: postgres
      DB_NAME: simmsilos
      DB_USER: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis
      SILO_SERVICE_URL: http://simmsilos-vsc:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  apache:
    image: httpd:alpine
    container_name: simmsilos-gateway
    networks: [simmsilos-net]
    ports:
      - "80:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - auth

networks:
  simmsilos-net:
    external: true

volumes:
  pgdata:
