events {}

http {
    server {
        listen 80;

        location /gateway/health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        location /branch/feature-x/ {
            rewrite ^/branch/feature-x/(.*) /$1 break;
            proxy_pass http://simmsilos-feature-x:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Branch feature-x;
        }

        location / {
            return 404 '{"error":"unknown branch — use /branch/<name>/"}';
            add_header Content-Type application/json;
        }
    }
}
